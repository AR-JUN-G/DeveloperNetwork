
services:
  app:
    build: .
    container_name: connectify-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/developer
      SPRING_DATASOURCE_USERNAME: developer
      SPRING_DATASOURCE_PASSWORD: 0911
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: connectify-database
    environment:
      POSTGRES_DB: developer
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: 0911
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d developer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
