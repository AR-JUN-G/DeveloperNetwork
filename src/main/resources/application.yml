spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/developer_network
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 7MB
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:${GITHUB_CLIENT_ID}}
            client-secret: ${GITHUB_CLIENT_SECRET:${GITHUB_CLIENT_SECRET}}
            scope:
              -read: user
              -user: email

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_CLOUD_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  oauth2:
    redirect-uri: http://localhost:5173/oauth2/redirect
  jwt:
    secret-key: ${APP_SECRET_KEY}